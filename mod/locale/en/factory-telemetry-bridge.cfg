[mod-setting-name]
ftb-transport=Telemetry transport
ftb-udp-port=Telemetry UDP port
ftb-watch-items=Watched items
ftb-force=Telemetry force
ftb-surface=Telemetry surface

[mod-setting-description]
ftb-transport=Publish a snapshot every 300 game ticks. File output is script-output/factory-telemetry-bridge/state.json. UDP attempts delivery and falls back to file output if the API call fails. Sampling still executes on multiplayer clients.
ftb-udp-port=UDP destination port used when transport is udp. Default: 34198. Range: 1024–65535. Configure the receiving application separately.
ftb-watch-items=Comma-separated internal item names included in production output even without recorded production. Unknown names are ignored. Default: ash,iron-plate,copper-plate,steel-plate,coal,stone,stone-brick.
ftb-force=Internal name of the force to observe. Default: player. The force must exist; an invalid name causes telemetry queries to fail.
ftb-surface=Internal name of the surface to observe. Default: nauvis. The surface must exist; an invalid name causes telemetry queries to fail. Only this surface is observed for production, power and map data.

[string-mod-setting]
ftb-transport-file=File
ftb-transport-udp=UDP with file fallback
