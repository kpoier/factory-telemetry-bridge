[mod-setting-name]
ftb-transport=遙測傳輸方式
ftb-udp-port=遙測 UDP 連接埠
ftb-watch-items=追蹤物品
ftb-force=遙測陣營
ftb-surface=遙測地表

[mod-setting-description]
ftb-transport=每 300 個遊戲 tick 發布一次快照。檔案輸出至 script-output/factory-telemetry-bridge/state.json。UDP 呼叫失敗時退回檔案輸出。多人遊戲的客戶端仍會執行資料採樣。
ftb-udp-port=傳輸方式為 udp 時使用的目的連接埠。預設 34198，範圍 1024–65535。接收程式需另外設定。
ftb-watch-items=以逗號分隔的物品內部名稱；即使尚無生產紀錄也會列入產量資料。不存在的名稱會忽略。預設 ash,iron-plate,copper-plate,steel-plate,coal,stone,stone-brick。
ftb-force=要觀察的陣營內部名稱，預設 player。陣營必須存在，否則遙測查詢會失敗。
ftb-surface=要觀察的地表內部名稱，預設 nauvis。地表必須存在，否則遙測查詢會失敗。產消、電力及地圖資料只觀察這個地表。

[string-mod-setting]
ftb-transport-file=檔案
ftb-transport-udp=UDP，失敗時改用檔案
